<!DOCTYPE html>
<html lang="tj">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="testTitle">Тест аз химия</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .test-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
            padding: 15px;
        }

        h2 {
            font-size: 2rem;
            margin: 0 0 10px;
            text-align: center;
        }

        .sub {
            text-align: center;
            font-size: 1.2rem;
            border-bottom: 1px solid #aaa;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .timer-block {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            background: #eee;
            padding: 10px;
            border: 1px solid #888;
            margin-bottom: 15px;
        }

        .question-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #888;
            padding: 20px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .q-counter {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .q-text {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            font-size: 1.4rem;
            border: 1px solid #888;
            padding: 10px 15px;
            background: #fff;
        }

        .option-item input[type="radio"] {
            width: 24px;
            height: 24px;
            margin-right: 20px;
            accent-color: #000;
        }

        .option-item label {
            width: 100%;
        }

        .nav-btn {
            background: #ddd;
            border: 2px solid #333;
            font-size: 2rem;
            font-weight: bold;
            padding: 20px;
            width: 100%;
            cursor: pointer;
            text-align: center;
            margin-top: 5px;
        }

        .nav-btn:hover {
            background: #ccc;
        }

        .result-area {
            border: 2px solid #222;
            background: #eee;
            font-size: 2.5rem;
            text-align: center;
            padding: 40px;
            margin-top: 20px;
        }

        .restart-btn {
            background: #bbb;
            margin-top: 30px;
            font-size: 1.8rem;
            padding: 15px;
            border: 2px solid #333;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .q-text {
                font-size: 1.4rem;
            }

            .option-item {
                font-size: 1.2rem;
            }

            .timer-block {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <h2 data-i18n="testTitle">🧪 ТЕСТХО</h2>
        <div class="sub" data-i18n="testSub">25 савол • ба ҳар савол 1 дақиқа</div>
        <div style="text-align: center; margin: 20px 0;">
            <a href="photo3.html" style="display: inline-block; 
              background: linear-gradient(to right, #606262, #5e605f);
              color: white;
              padding: 12px 30px;
              border-radius: 50px;
              text-decoration: none;
              font-weight: bold;
              font-size: 1.1rem;
              box-shadow: 0 5px 15px rgba(225, 225, 227, 0.4);
              transition: all 0.3s;">
                <i class="fas fa-book"></i> <span data-i18n="btnCalc">Канкулятори Химияви</span>
            </a>
            <a href="photo2.html" style="display: inline-block; 
              background: linear-gradient(to right, #595c5b, #676969);
              color: white;
              padding: 12px 30px;
              border-radius: 50px;
              text-decoration: none;
              font-weight: bold;
              font-size: 1.1rem;
              box-shadow: 0 5px 15px rgba(205, 206, 206, 0.4);
              transition: all 0.3s;">
                <i class="fas fa-book"></i> <span data-i18n="btnInfo">МАЪЛУМОТ ДАР БОРАИ ХИМИЯ</span>
            </a>
            <a href="photo.html" style="display: inline-block; 
              background: linear-gradient(to right, #4b4e4e, #777978);
              color: white;
              padding: 12px 30px;
              border-radius: 50px;
              text-decoration: none;
              font-weight: bold;
              font-size: 1.1rem;
              box-shadow: 0 5px 15px rgba(171, 173, 173, 0.4);
              transition: all 0.3s;">
                <i class="fas fa-table"></i> <span data-i18n="btnTable">ҶАДВАЛИ МЕНДЕЛЕЕВ</span>
            </a>
        </div>

        <div class="timer-block" id="timerDisplay">01:00</div>

        <div id="questionArea" class="question-panel">
            <div class="q-counter" id="questionCounter">Саволи 1 / 25</div>
            <div class="q-text" id="questionText">Загрузка...</div>
            <div class="options" id="optionsContainer"></div>
        </div>

        <button class="nav-btn" id="nextBtn" data-i18n="nextBtn">▶ БА САВОЛИ ОЯНДА</button>

        <div id="resultBlock" class="result-area hidden">
            🏆 <span id="scoreValue">0</span> <span data-i18n="scoreText">аз 25 дуруст</span>
            <button class="nav-btn restart-btn" id="restartBtn" data-i18n="restartBtn">🔁 Аз нав оғоз</button>
        </div>
    </div>

    <script>
        (function () {
            function getQuestions() {
                if (window.i18n && typeof i18n.getQuizQuestions === 'function') {
                    return i18n.getQuizQuestions().map(item => ({
                        question: item.q,
                        options: item.o,
                        correct: item.c
                    }));
                }
                return [];
            }

            let questions = getQuestions();
            let TOTAL_QS = questions.length || 25;
            let currentIndex = 0;
            let userAnswers = new Array(TOTAL_QS).fill(null);
            let timerInterval = null;
            let timeLeft = 60;
            const TIME_PER_QUESTION = 60;

            const timerEl = document.getElementById('timerDisplay');
            const qCounterEl = document.getElementById('questionCounter');
            const qTextEl = document.getElementById('questionText');
            const optionsContainer = document.getElementById('optionsContainer');
            const nextBtn = document.getElementById('nextBtn');
            const questionArea = document.getElementById('questionArea');
            const resultBlock = document.getElementById('resultBlock');
            const scoreSpan = document.getElementById('scoreValue');
            const restartBtn = document.getElementById('restartBtn');

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function startTimer() {
                stopTimer();
                timeLeft = TIME_PER_QUESTION;
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        stopTimer();
                        moveToNextQuestion();
                    }
                }, 1000);
            }

            function updateTimerDisplay() {
                const mins = Math.floor(Math.max(0, timeLeft) / 60);
                const secs = Math.max(0, timeLeft) % 60;
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            function renderQuestion() {
                questions = getQuestions();
                TOTAL_QS = questions.length;
                if (!questions.length) {
                    qTextEl.textContent = (window.i18n ? i18n.t('loading') : 'Loading...');
                    return;
                }
                const q = questions[currentIndex];
                const prefix = (window.i18n ? i18n.t('questionOf', { n: currentIndex + 1, total: TOTAL_QS }) : `Саволи ${currentIndex + 1} / ${TOTAL_QS}`);
                qCounterEl.textContent = prefix;
                qTextEl.textContent = q.question;

                let htmlStr = '';
                for (let i = 0; i < q.options.length; i++) {
                    const checkedAttr = (userAnswers[currentIndex] === i) ? 'checked' : '';
                    htmlStr += `
                <div class="option-item">
                    <input type="radio" name="qOption" value="${i}" id="opt${i}" ${checkedAttr}>
                    <label for="opt${i}">${q.options[i]}</label>
                </div>
            `;
                }
                optionsContainer.innerHTML = htmlStr;

                document.querySelectorAll('input[name="qOption"]').forEach(radio => {
                    radio.addEventListener('change', function (e) {
                        userAnswers[currentIndex] = parseInt(e.target.value);
                    });
                });

                startTimer();
            }

            function calculateScore() {
                let correct = 0;
                for (let i = 0; i < TOTAL_QS; i++) {
                    if (userAnswers[i] !== null && userAnswers[i] === questions[i].correct) {
                        correct++;
                    }
                }
                return correct;
            }

            function moveToNextQuestion() {
                stopTimer();
                if (currentIndex === TOTAL_QS - 1) {
                    showResults();
                    return;
                }
                currentIndex++;
                renderQuestion();
            }

            function showResults() {
                stopTimer();
                questionArea.classList.add('hidden');
                nextBtn.classList.add('hidden');
                resultBlock.classList.remove('hidden');
                scoreSpan.textContent = calculateScore();
            }

            function restartTest() {
                stopTimer();
                currentIndex = 0;
                userAnswers = new Array(TOTAL_QS).fill(null);
                questionArea.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                resultBlock.classList.add('hidden');
                renderQuestion();
            }

            nextBtn.addEventListener('click', moveToNextQuestion);
            restartBtn.addEventListener('click', restartTest);

            document.addEventListener('languageChanged', () => {
                questions = getQuestions();
                TOTAL_QS = questions.length;
                userAnswers = new Array(TOTAL_QS).fill(null);
                currentIndex = 0;
                if (!resultBlock.classList.contains('hidden')) {
                    restartTest();
                } else {
                    renderQuestion();
                }
            });

            function initTest() {
                resultBlock.classList.add('hidden');
                questionArea.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                setTimeout(() => {
                    questions = getQuestions();
                    TOTAL_QS = questions.length || 25;
                    userAnswers = new Array(TOTAL_QS).fill(null);
                    renderQuestion();
                }, 50);
            }

            initTest();
        })();
    </script>

<script src="js/i18n.js"></script>

</body>

</html>
