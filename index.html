<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SCANNERI ELEMENTHO — замонавӣ рақамии лабораторияи химиявӣ. Ҷадвали даврии элементҳо, калькулятор, тестҳо ва маълумот.">
    <title data-i18n="siteTitle">SCANNERI ELEMENTHO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070b14;
            --bg: #0a0f1a;
            --surface: rgba(15, 23, 42, 0.7);
            --border: rgba(34, 211, 238, 0.18);
            --accent: #22d3ee;
            --accent-dim: #0891b2;
            --accent-glow: rgba(34, 211, 238, 0.3);
            --secondary: #818cf8;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius: 16px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(34, 211, 238, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(129, 140, 248, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse 50% 30% at 50% 90%, rgba(8, 145, 178, 0.06) 0%, transparent 40%),
                var(--bg-deep);
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 70%);
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.4;
            animation: float 12s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-40px) translateX(15px); opacity: 0.6; }
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 24px;
            max-width: 720px;
        }

        .logo-mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(129, 140, 248, 0.15));
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 0 40px var(--accent-glow);
            animation: pulse-glow 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 30px var(--accent-glow); }
            50% { box-shadow: 0 0 50px rgba(34, 211, 238, 0.45); }
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #e2e8f0 0%, #22d3ee 60%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #22d3ee, #0891b2);
            color: #0a0f1a;
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            transition: transform 0.25s, box-shadow 0.25s;
            box-shadow: 0 8px 30px rgba(34, 211, 238, 0.35);
        }

        .cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(34, 211, 238, 0.5);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 48px;
            width: 100%;
            max-width: 640px;
        }

        .nav-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 16px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .nav-card:hover {
            border-color: var(--accent);
            background: rgba(34, 211, 238, 0.08);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-card .icon {
            font-size: 1.6rem;
            color: var(--accent);
        }

        .nav-card span {
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
        }

        .footer-note {
            margin-top: 56px;
            font-size: 0.8rem;
            color: var(--text-dim);
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .nav-grid { grid-template-columns: 1fr 1fr; }
            .cta { padding: 14px 28px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="bg-grid"></div>
    <div class="particles" id="particles"></div>

    <div class="content">
        <div class="logo-mark">⚛</div>
        <h1 data-i18n="siteTitle">SCANNERI ELEMENTHO</h1>
        <p class="tagline" data-i18n="subtitle">Ҷадвали даврии элементҳои химия — 118 элемент. Рақамии лабораторияи замонавӣ.</p>

        <a href="photo.html" class="cta">
            Кушодани сканер →
        </a>

        <div class="nav-grid">
            <a href="photo.html" class="nav-card">
                <span class="icon">⬡</span>
                <span data-i18n="btnTable">Ҷадвали Менделеев</span>
            </a>
            <a href="photo2.html" class="nav-card">
                <span class="icon">📘</span>
                <span data-i18n="btnInfo">Маълумот дар бораи химия</span>
            </a>
            <a href="photo3.html" class="nav-card">
                <span class="icon">🧮</span>
                <span data-i18n="btnCalc">Канкулятори химиявӣ</span>
            </a>
            <a href="photo4.html" class="nav-card">
                <span class="icon">🧪</span>
                <span data-i18n="btnTest">Тестҳои химиявӣ</span>
            </a>
        </div>

        <p class="footer-note">Иҷрокунанда: Ҳасанов.О · 2026</p>
    </div>

    <script>
        const container = document.getElementById('particles');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = (Math.random() * 8) + 's';
            p.style.animationDuration = (10 + Math.random() * 8) + 's';
            p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
            container.appendChild(p);
        }
    </script>
    <script src="js/i18n.js"></script>
</body>
</html>
